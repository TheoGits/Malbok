<!DOCTYPE html>
<html lang="no"><head><meta charset="utf-8"><title>Målbok</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Målbok">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6f0f8;--card:#fff;--tx:#0c1b2e;--mu:#5a6f87;--ln:#d3e1ee;--red:#e11d48;--ice:#0284c7;--bar:#e3edf6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1626;--card:#122238;--tx:#e8f1fb;--mu:#8fa6c0;--ln:#233a57;--red:#ff4d6d;--ice:#4cc3ff;--bar:#1b3050}}
:root[data-theme="dark"]{--bg:#0a1626;--card:#122238;--tx:#e8f1fb;--mu:#8fa6c0;--ln:#233a57;--red:#ff4d6d;--ice:#4cc3ff;--bar:#1b3050}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 16px 100px;max-width:560px;margin:0 auto}
h1,h2,.big-n{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.02em;margin:0}
h2{font-size:30px;margin:22px 0 12px}
.hero{margin-top:18px;padding:22px 20px 18px;border-radius:22px;background:var(--card);border:1px solid var(--ln);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--red);opacity:.5}
.hero:after{content:"";position:absolute;left:50%;top:-20%;bottom:-20%;width:2px;background:var(--ice);opacity:.18}
.hero>*{position:relative;z-index:1}
.big-n{font-size:124px;line-height:.9;color:var(--red);background:var(--card);display:inline-block;padding:0 12px 0 0}
.sub{color:var(--mu);margin:6px 0 0;background:var(--card);display:inline-block;padding-right:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px}
.stat b{display:block;font-size:24px;font-family:"Bebas Neue",Impact,sans-serif;font-weight:400}
.stat span{font-size:12px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:15px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.row .l{width:112px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t{flex:1;height:12px;background:var(--bar);border-radius:6px;overflow:hidden}
.row .t i{display:block;height:100%;border-radius:6px;min-width:3px}
.row .v{width:64px;text-align:right;color:var(--mu);font-variant-numeric:tabular-nums}
.months{display:flex;align-items:flex-end;gap:8px;height:120px}
.months div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--mu)}
.months i{display:block;width:100%;background:var(--ice);border-radius:6px 6px 0 0;min-height:3px}
label{display:block;font-size:13px;color:var(--mu);margin:14px 0 6px}
label:first-child{margin-top:0}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:12px}
textarea{height:110px;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill{font:inherit;font-weight:600;padding:14px 8px;border-radius:14px;border:2px solid var(--ln);background:var(--bg);color:var(--tx)}
.pill.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;padding:9px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
.chip.on{background:var(--ice);border-color:var(--ice);color:#fff;font-weight:600}
.inl{display:flex;gap:8px;margin-top:10px}
.sm{font:inherit;padding:0 16px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);white-space:nowrap}
.cta{width:100%;margin-top:20px;font:inherit;font-size:18px;font-weight:700;padding:16px;border:0;border-radius:16px;background:var(--red);color:#fff}
.g{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--ln)}
.g:last-child{border:0}
.g .dot{width:10px;height:36px;border-radius:5px;flex:none}
.g div{flex:1;min-width:0}
.g small{color:var(--mu);display:block}
.g button{font:inherit;font-size:13px;background:none;border:0;color:var(--mu);padding:8px}
.g button.ask{color:var(--red);font-weight:700}
.empty{text-align:center;color:var(--mu);padding:30px 16px}
.warn{background:color-mix(in srgb,var(--red) 14%,var(--card));border-color:var(--red);font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{color:var(--red);font-weight:700}
#t{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
#t.s{opacity:1}
</style></head><body>
<div id="app"></div><div id="t"></div>
<nav id="nav"></nav>
<script>
var K="malbok-v1",TYPES=["Åpen ishall","Øvelse","Kamp på trening","Kamp"],COL=["#0ea5e9","#8b5cf6","#f59e0b","#e11d48"];
var $=function(s){return document.querySelector(s)};
function load(){try{var d=JSON.parse(localStorage.getItem(K));if(d&&d.goals)return d}catch(e){}return{goals:[],players:[],lb:0}}
var S=load(),tab=0,pend=null;
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast("Kunne ikke lagre – ta backup nå")}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var F={type:3,assist:"",date:today()};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return"&#"+c.charCodeAt(0)+";"})}
function fmt(d){return new Date(d+"T12:00").toLocaleDateString("nb-NO",{day:"numeric",month:"short",year:"numeric"})}
function pc(n,t){return t?Math.round(n/t*100)+" %":"0 %"}
function toast(m){var t=$("#t");t.textContent=m;t.className="s";setTimeout(function(){t.className=""},1800)}
function bars(a,tot){return a.map(function(x){return'<div class="row"><div class="l">'+esc(x.l)+'</div><div class="t"><i style="width:'+(tot?x.n/tot*100:0)+'%;background:'+x.c+'"></i></div><div class="v">'+x.n+" · "+pc(x.n,tot)+"</div></div>"}).join("")}
function over(){
var g=S.goals,n=g.length;
if(!n)return'<div class="hero"><div class="big-n">0</div><p class="sub">mål så langt</p></div><div class="card empty">Ingen mål ennå. Trykk på «Nytt mål» når du har scoret.</div>';
var d30=new Date();d30.setDate(d30.getDate()-30);var k30=d30.getFullYear()+"-"+String(d30.getMonth()+1).padStart(2,"0")+"-"+String(d30.getDate()).padStart(2,"0");
var bt=TYPES.map(function(t,i){return{l:t,n:g.filter(function(x){return x.type===i}).length,c:COL[i]}});
var top=bt.slice().sort(function(a,b){return b.n-a.n})[0];
var na=g.filter(function(x){return!x.assist}).length,as={};
g.forEach(function(x){if(x.assist)as[x.assist]=(as[x.assist]||0)+1});
var al=Object.keys(as).sort(function(a,b){return as[b]-as[a]}).map(function(k){return{l:k,n:as[k],c:"var(--ice)"}});
al.push({l:"Uten assist",n:na,c:"var(--mu)"});
var ms=[],mx=1;
for(var k=5;k>=0;k--){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()-k);var key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");var c=g.filter(function(x){return x.date.slice(0,7)===key}).length;mx=Math.max(mx,c);ms.push({l:d.toLocaleDateString("nb-NO",{month:"short"}),n:c})}
var w=(Date.now()-(S.lb||0)>12096e5)?'<div class="card warn">Det er over to uker siden sist backup. Gå til «Backup» og kopier dataene dine.</div>':"";
return w+'<div class="hero"><div class="big-n">'+n+'</div><p class="sub">mål totalt</p></div>'
+'<div class="stats"><div class="stat"><b>'+g.filter(function(x){return x.date>=k30}).length+'</b><span>siste 30 dager</span></div><div class="stat"><b>'+pc(n-na,n)+'</b><span>med assist</span></div><div class="stat"><b>'+esc(top.l)+'</b><span>flest mål</span></div></div>'
+'<h2>Hvor scorer du?</h2><div class="card">'+bars(bt,n)+'</div>'
+'<h2>Assists</h2><div class="card">'+bars(al,n)+'</div>'
+'<h2>Siste 6 måneder</h2><div class="card"><div class="months">'+ms.map(function(m){return"<div>"+m.n+'<i style="height:'+(m.n/mx*80)+'%"></i>'+m.l+"</div>"}).join("")+"</div></div>"}
function add(){
return"<h2>Nytt mål</h2><div class='card'><label>Dato</label><input type='date' value='"+F.date+"' onchange='F.date=this.value'>"
+"<label>Hvor</label><div class='grid'>"+TYPES.map(function(t,i){return"<button class='pill "+(F.type===i?"on":"")+"' style='--c:"+COL[i]+"' onclick='F.type="+i+";render()'>"+t+"</button>"}).join("")+"</div>"
+"<label>Assist</label><div class='chips'><button class='chip "+(!F.assist?"on":"")+"' onclick=\"F.assist='';render()\">Ingen</button>"+S.players.map(function(p,i){return"<button class='chip "+(F.assist===p?"on":"")+"' onclick='F.assist=S.players["+i+"];render()'>"+esc(p)+"</button>"}).join("")+"</div>"
+"<div class='inl'><input id='np' placeholder='Ny spiller' maxlength='30'><button class='sm' onclick='addP()'>Legg til</button></div>"
+"<button class='cta' onclick='addG()'>Registrer mål</button></div>"}
function addP(){var v=$("#np").value.trim();if(!v)return;if(S.players.indexOf(v)<0)S.players.push(v);F.assist=v;save();render()}
function addG(){if(!F.date)return toast("Velg dato");S.goals.push({id:Date.now(),date:F.date,type:F.type,assist:F.assist});save();F.assist="";tab=0;render();window.scrollTo(0,0);toast("Mål registrert!")}
function hist(){
var g=S.goals.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id});
return"<h2>Alle mål ("+g.length+")</h2><div class='card'>"+(g.length?g.map(function(x){return"<div class='g'><span class='dot' style='background:"+COL[x.type]+"'></span><div><b>"+TYPES[x.type]+"</b><small>"+fmt(x.date)+" · "+(x.assist?"Assist: "+esc(x.assist):"Ingen assist")+"</small></div><button class='"+(pend===x.id?"ask":"")+"' onclick='del("+x.id+")'>"+(pend===x.id?"Sikker?":"Slett")+"</button></div>"}).join(""):"<div class='empty'>Ingen mål registrert.</div>")+"</div>"}
function del(id){if(pend===id){S.goals=S.goals.filter(function(x){return x.id!==id});pend=null;save();render()}else{pend=id;render();setTimeout(function(){pend=null;render()},3000)}}
function bk(){
var l=S.lb?"Siste backup: "+new Date(S.lb).toLocaleDateString("nb-NO"):"Ingen backup tatt ennå";
return"<h2>Backup</h2><div class='card'><p style='margin-top:0'>Dataene ligger kun på denne telefonen. Kopier dem og lim inn i f.eks. Notater eller send til deg selv. "+l+".</p><textarea id='bk' placeholder='Backup vises her. Lim inn gammel backup for å gjenopprette.'></textarea><div class='inl'><button class='sm' onclick='cp()'>Kopier backup</button>"+(navigator.share?"<button class='sm' onclick='sh()'>Del</button>":"")+"<button class='sm' onclick='imp()'>Importer</button></div><p style='color:var(--mu);font-size:13px;margin-bottom:0'>Import slår sammen med det som allerede er lagret.</p></div>"}
function js(){S.lb=Date.now();save();return JSON.stringify({goals:S.goals,players:S.players})}
function cp(){var t=$("#bk");t.value=js();t.select();try{navigator.clipboard.writeText(t.value).then(function(){toast("Kopiert")},function(){document.execCommand("copy");toast("Kopiert")})}catch(e){try{document.execCommand("copy");toast("Kopiert")}catch(e2){toast("Marker teksten og kopier selv")}}}
function sh(){navigator.share({title:"Målbok backup",text:js()}).catch(function(){})}
function imp(){try{var d=JSON.parse($("#bk").value);if(!d.goals)throw 0;var ids={};S.goals.forEach(function(x){ids[x.id]=1});var c=0;d.goals.forEach(function(x){if(!ids[x.id]&&x.date&&TYPES[x.type]){S.goals.push({id:x.id,date:x.date,type:x.type,assist:x.assist||""});c++}});(d.players||[]).forEach(function(p){if(S.players.indexOf(p)<0)S.players.push(p)});save();toast(c+" mål importert");tab=0;render()}catch(e){toast("Ugyldig backup-tekst")}}
function render(){
$("#app").innerHTML=[over,add,hist,bk][tab]();
$("#nav").innerHTML=[["📊","Oversikt"],["🏒","Nytt mål"],["📋","Historie"],["💾","Backup"]].map(function(x,i){return"<button class='"+(tab===i?"on":"")+"' onclick='tab="+i+";render();window.scrollTo(0,0)'><span>"+x[0]+"</span>"+x[1]+"</button>"}).join("")}
render();
</script></body></html>
